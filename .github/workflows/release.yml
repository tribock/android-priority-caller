name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          # Conventional Commits since the last tag decide the bump:
          #   fix: -> patch, feat: -> minor, "BREAKING CHANGE"/feat!: -> major.
          # Anything else (docs:, chore:, plain messages, ...) still bumps patch.

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "${{ secrets.JKS_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          JKS_STORE_PATH: ${{ runner.temp }}/release.jks
          JKS_STORE_PW: ${{ secrets.JKS_STORE_PW }}
          JKS_KEY_ALIAS: ${{ secrets.JKS_KEY_ALIAS }}
          JKS_KEY_PW: ${{ secrets.JKS_KEY_PW }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PversionNameOverride=${{ steps.tag.outputs.new_version }} \
            -PversionCodeOverride=${{ github.run_number }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: app/build/outputs/apk/release/priority_caller_${{ steps.tag.outputs.new_version }}.apk
